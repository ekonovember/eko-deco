name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"          # the source is UTF-8 (Bühlmann, ₂) — see README

jobs:
  # The core suite must stay standard-library-only and pass on a bare Python,
  # on every OS, without compilers. That is the promise the project makes; this
  # matrix is what enforces it.
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite (no install, no dependencies)
        run: python -m unittest discover -s tests -t . -v

  # The cross-checks compile the reference implementations and run eko-deco
  # against them. They skip themselves when the compilers are missing, so this
  # job exists to make sure they are never *silently* skipped everywhere.
  crosschecks:
    name: cross-checks vs Subsurface, Baker GFDECO + python oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the oracle toolchains
        run: sudo apt-get update && sudo apt-get install -y g++ gfortran
      - name: Install the python oracles (test-only, GPL-3, never vendored)
        run: python -m pip install decotengu decodaitengu
      - run: python -m unittest tests.test_subsurface_crosscheck -v
      - run: python -m unittest tests.test_baker_crosscheck -v
      - run: python -m unittest tests.test_python_oracles -v
      - name: Fail if either oracle skipped instead of running
        run: |
          python - <<'PY'
          import io, unittest
          from contextlib import redirect_stderr
          buf = io.StringIO()
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_subsurface_crosscheck", "tests.test_baker_crosscheck",
              "tests.test_python_oracles"])
          with redirect_stderr(buf):
              result = unittest.TextTestRunner(stream=buf, verbosity=0).run(suite)
          if result.testsRun == 0 or result.skipped:
              raise SystemExit(
                  f"oracles did not run: {result.testsRun} tests, "
                  f"{len(result.skipped)} skipped\n{buf.getvalue()}")
          print(f"{result.testsRun} cross-check tests ran against all four oracles")
          PY

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,gui]"
      - run: ruff check --output-format=github .
      - run: mypy

  # Coverage gates the STDLIB-ONLY core — buhlmann, report, toxicity,
  # contingency, dive_config, cli — the modules the safety math and the warning
  # surface live in. deco.app and deco.cards sit behind the [gui] extra and are
  # reported but not gated: chasing a percentage through Tk event handlers buys
  # less than one more cross-check.
  #
  # The whole suite runs with every toolchain installed, so the number is
  # measured against a complete run and cannot drift when something silently
  # skips. The threshold is a RATCHET set just under where the core stands
  # (94 %), not a stretch goal — it exists to catch a regression, and raising it
  # is a deliberate act.
  #
  # The percentage is the weakest thing this job produces. Reading the uncovered
  # lines is what found DECISIONS #34: a guard that a clamp had made
  # unreachable, indistinguishable in this report from a line nobody had tested.
  coverage:
    name: coverage (core >= 92%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install everything, so nothing skips out of the measurement
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk g++ gfortran
          pip install -e ".[dev,gui]"
      - name: Run the whole suite under coverage
        run: xvfb-run -a python -m coverage run -m unittest discover -s tests -t .
      - name: The core must stay covered
        run: |
          python -m coverage report --fail-under=92 \
            --include='*/deco/buhlmann.py,*/deco/report.py,*/deco/toxicity.py,*/deco/contingency.py,*/deco/dive_config.py,*/deco/cli.py'
      - name: Front ends, for the record (not gated)
        run: python -m coverage report

  gui:
    name: GUI smoke test (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: pip install -e ".[gui]"
      - name: Build the window and render one plan off-screen
        run: xvfb-run -a python -m unittest tests.test_app_levels -v
      # The GUI arm of the input-coverage suite is what proves every plan field
      # actually binds through a widget (DECISIONS #19). It skips without Tk
      # exactly like the rest, so it needs the display too.
      - name: Prove every plan field binds through a real widget
        run: xvfb-run -a python -m unittest tests.test_input_coverage -v
      # These tests skip themselves without Tk/matplotlib, exactly like the
      # oracles — so, exactly like the oracles, prove they really ran.
      - name: Fail if the GUI tests skipped instead of running
        run: |
          xvfb-run -a python - <<'PY'
          import io, unittest
          from contextlib import redirect_stderr
          buf = io.StringIO()
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_app_levels", "tests.test_input_coverage"])
          with redirect_stderr(buf):
              result = unittest.TextTestRunner(stream=buf, verbosity=0).run(suite)
          if result.testsRun == 0 or result.skipped:
              raise SystemExit(
                  f"GUI tests did not run: {result.testsRun} tests, "
                  f"{len(result.skipped)} skipped\n{buf.getvalue()}")
          print(f"{result.testsRun} GUI tests ran against a real Tk window")
          PY

  package:
    name: build + metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel must carry the icons, the typing marker and the card engine
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          # cards.py is in here on purpose: the printed runtime card is a
          # product surface, and shipping it is the whole of DECISIONS #31.
          want = ("deco/py.typed", "deco/assets/icon.png", "deco/assets/icon.ico",
                  "deco/cards.py", "deco/toxicity.py", "deco/contingency.py")
          missing = [n for n in want if n not in names]
          if missing:
              raise SystemExit(f"missing from wheel: {missing}")
          print("wheel contents OK")
          PY
